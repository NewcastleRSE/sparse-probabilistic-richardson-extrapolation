site_name: SPRE Python API

theme:
  name: material

nav:
  - Home: index.md
  - Code Description: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true