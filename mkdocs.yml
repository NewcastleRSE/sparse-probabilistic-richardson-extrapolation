site_name: Sparse Probabilistic Richardson Extrapolation (SPRE)
site_url: https://newcastlerse.github.io/sparse-probabilistic-richardson-extrapolation/
repo_url: https://github.com/NewcastleRSE/sparse-probabilistic-richardson-extrapolation

theme:
  name: material

nav:
  - Home: index.md
  - Code Description: api.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            show_signature_annotations: true
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true

# docs/requirements.txt lists the packages needed to build the documentation
exclude_docs: |
  requirements.txt
